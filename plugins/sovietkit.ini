; sovietkit.ini - anarchy, skins, trackcrew and walking, in one plugin
;
; SAVE THIS AS UTF-8 **WITHOUT** A BOM. PowerShell 5.1's -Encoding UTF8 writes a
; BOM, the first section header stops matching, and every setting below silently
; falls back to its default. Nothing is logged. Nothing looks wrong.
;
; One log for all four parts: tesmioloader\build\sovietkit.log


; ===========================================================================
;  THE FOUR PARTS. This is the switch you came here for.
;
;  Setting one to 0 means that part installs nothing: no hooks, no patches, no
;  hotkeys, no per-frame work. The others are unaffected. It is the first
;  thing to try if you suspect one of them of anything.
; ===========================================================================
[sovietkit]
anarchy   = 1   ; build it where you want it, on Alt+F
skins     = 1   ; the spray-can and the picker remember which skin you chose
trackcrew = 1   ; rail construction trains ignore signals and each other
walking   = 1   ; citizens walk further - see [walking] below

; Each part also has an `enabled` in its own section below. They are not
; redundant: the switch HERE means "never load this part at all", and the one
; down there means what it meant when the parts were separate plugins. For
; anarchy and skins that is the same thing. For trackcrew it is not - there,
; `enabled` is the RUNTIME switch the toggle key flips, so the hook installs
; either way and you can turn it on mid-session. If you want trackcrew gone
; entirely, use the line above.


; ===========================================================================
;  ANARCHY - build it where you want it
;
;  Press Alt+F and every "you can't build that there" goes quiet: slope, angle,
;  terrain, water, collisions, crossings, connection rules. Press it again and
;  all 367 bytes go back where they were. While it is on, the word ANARCHY sits
;  on screen so you never wonder which mode you are in.
; ===========================================================================
[anarchy]
enabled            = 1   ; same as anarchy = 0 above, kept so the old ini works

; LAYER 1 - three hooks on three of the game's own predicates. Each one lies
; only when the question came from inside a build tool; the rest of the game
; gets the truth. As of 1.3 they answer to the same key as layer 2 - see
; layer1_follows_key below for why that changed.
ignore_buildings   = 1   ; "Building in the way"
ignore_signals     = 1   ; "Semaphore/signals/waypoint in the way"
ignore_overlap     = 1   ; "Overlaps with existing construction!"

; While anarchy is ON, should layer 1 widen from "the shared drag-a-line tool"
; to EVERY tool in the game?
;
; With it off, the three hooks above judge by return address, which covers rail,
; roads, pipes, water, sewage, heating, conveyors, fences, cableways and power
; lines - they are all literally the same function. It does not cover the tools
; with their own body: second_road, factory connections, road waypoints.
;
; With it on, anarchy also hooks the ONE call that reaches the game's tool
; dispatcher and sets a flag for the duration. Inside that flag, any build tool
; is in scope - including ones nobody went looking for - and buildings can be
; dropped on other buildings. Tied to the anarchy key rather than always on,
; because that is not a state you want to forget you are in.
widen_to_buildings = 1

; DOES THE KEY TURN LAYER 1 OFF TOO? (new in 1.3, and it is why "off" used to
; look like it had done nothing)
;
; Before 1.3 layer 1 was always on and only layer 2 answered to Alt+F. That
; sounded like the conservative choice and was not, because 0x4FCAF0 is not the
; rail tool - it is rail AND roads AND pipes AND conveyors AND fences AND
; cableways, all one function. So "layer 1 only" meant collision, signal
; proximity and construction overlap were off for everything you drag, for the
; whole session, while the indicator was dark and the log said ANARCHY OFF.
;
; 1 = the key is the whole switch. Off is off.
; 0 = the old behaviour: the three predicate hooks stay on permanently and only
;     the byte edits follow the key. The log says so every time you press it.
layer1_follows_key = 1

; LAYER 2 - the key. 370 single-byte edits of five shapes:
;   82  mov byte [state+0x315], 0    -> 1        a check clearing the valid flag
;   31  xor dil, dil -> cmp dil, dil             the building tool's register form
;    4  a conditional jump -> the same jump, unconditional
;    7  mov [state+0x315], reg -> mov reg, [state+0x315]   store turned into load
;  246  the top byte of a recorded message id, 00 -> FF   (see `messages` below)
;
; One of the four jumps is the gate: of the 228 refusals the drag tools can
; raise, only 63 clear the valid flag themselves. The other 165 write a category
; and a message id and leave ONE instruction - exe+0x5116FB - to turn that record
; into a refusal. Two of the remaining jumps and four of the seven loads are new
; in 1.4 and are the reason fences stopped refusing; see an_sites.h.
start_on           = 0   ; 1 = already on when the game starts. Think about it.

; THE ONE REFUSAL ANARCHY LEAVES ALONE.
;
; "Outside map borders!" is not the game being fussy - it is the last check
; between the build tools and memory the game does not own. Turning it on is a
; crash, not a feature, and the log will say so every time anarchy comes on.
;
; This covers BOTH copies of that check - the building tool's and the wire
; validator's, which 1.4 found and which is now under the same switch. The drag
; tool has none, because its cursor comes from a raycast that has to land on
; terrain.
allow_outside_map  = 0

; SPLITTING THE LIST UP, for when something goes wrong and you want to know
; which part of it did. Of the 370 sites: 298 belong to the shared drag-a-line
; tool, 32 to the wire and pole validator - which is also what validates FENCES
; - 5 to the pipe segment validator and 35 to the tool that places buildings.
lines              = 1   ; rail, road bridges, pipes, water, sewage, heating,
                         ; conveyors, fences, cableways, airroads, power lines
wires              = 1   ; the wire and pole validator: power lines AND fences
pipes              = 1   ; the pipe segment validator: slope, depth, length
buildings          = 1   ; the tool that places buildings

; AND THE SIXTH FAMILY, which is a different kind of thing (new in 1.5).
;
; Everything above makes the placement legal. None of it makes the game stop
; SAYING it is illegal - and the warning and the red preview are what you
; actually look at, so anarchy looked broken while it was working.
;
; The tool UI draws that warning straight from the message id the refusal
; recorded, without ever asking whether the placement is valid:
;
;     mov edx, [state+0x31c]     ; the message id
;     test edx, edx
;     js   skip                  ; negative means "nothing to report"
;
; So 246 sites now set the top byte of that recorded id to FF, which makes it
; negative - one byte, same instruction, same length. With anarchy on there is
; no refusal, so there is no record of one, and the tooltip and the red preview
; go with it.
;
; The one write that records "Outside map borders!" is left alone, so the single
; refusal anarchy does not remove still explains itself. A silent refusal would
; be worse than a noisy one.
;
; 0 here leaves the messages showing while everything still builds - which is
; what 1.4 did, and is worth having if you want to see what WOULD have been
; refused.
messages           = 1

debug              = 0   ; 1 counts what this part does. Each count is one
                         ; interlocked increment on the simulation thread, so it
                         ; is a diagnostic setting, not a play setting. Turn it
                         ; on together with trace when something looks wrong.
heartbeat_seconds  = 15  ; 0 turns this part's heartbeat line off

; THE ON-SCREEN INDICATOR
[indicator]
show       = 1
text       = ANARCHY      ; any text you like; UTF-8, up to 47 bytes
from_right = 1            ; 1 = x is measured from the RIGHT edge of the window,
                          ; 0 = from the left
x          = 200          ; pixels in from that edge. The text is drawn
                          ; left-aligned from there, so nudge it until it sits
                          ; where you want.
y          = 120          ; pixels from the top
colour     = 0xFFFF3020   ; AARRGGBB. 0xFFFFFFFF is white.


; ===========================================================================
;  SKINS - the spray-can decides what you build NEXT
;
;  Recolour a building with the game's own spray-can and the plugin takes that
;  as a decision about the TYPE: every building of that type you place from then
;  on is built already wearing that skin. The ones already standing are left
;  exactly as you built them. No hotkey needed for any of it.
; ===========================================================================
[skins]
enabled            = 1

watch_changes      = 1   ; notice you using the game's skin button
spread_on_change   = 0   ; ...and ALSO repaint the ones already standing.
                         ; Off is the default, and the undo key reverses it.
retain_on_pick     = 1   ; the picker remembers the skin of the building it picked
auto_apply_new     = 1   ; buildings placed afterwards are built wearing it
only_default_skin  = 1   ; never repaint a building that is already off skin 0.
                         ; Turn this off and auto-apply will overwrite skins you
                         ; set by hand. Leave it on.
dry_run            = 0   ; detect everything, log everything, write nothing

scan_ms            = 250 ; how often to look for newly placed buildings.
                         ; NOT per frame. 250 = four times a second.
chunk              = 4096; buildings processed per frame while a mass apply or a
                         ; reconcile runs. Lower it if a very large republic hitches.

debug              = 0
heartbeat_seconds  = 15


; ===========================================================================
;  TRACKCREW - rail construction trains ignore signals and each other
;
;  HOW A TRACK BUILDER IS RECOGNISED, since 0.7: by the game's own flag. Every
;  train's script.ini either declares $TRAINGROUP_TRACKBUILDER or it does not,
;  and that is what the game itself reads. The plugin reads the same thing - the
;  feature index on the vehicle type - so it is equally right about the base
;  game's eleven, the DLC's, a disassembled one, and a workshop train nobody has
;  ever seen. Nothing below needs touching for a modded track builder.
;
;  The `match` list is now only a FALLBACK, used if a game update moves the two
;  offsets the flag is read through. The log says which route is in use.
; ===========================================================================
[trackcrew]
enabled            = 1
learn_from_button  = 0   ; treat "Ignore red signal" on one train as a statement
                         ; about its whole model. OFF by default: the game means
                         ; it for ONE train and ONE signal and clears it again.
relearn_ms         = 5000

; Left unset, the built-in list is the two prefixes that cover every rail
; construction train in the base game - read out of media_soviet\trains\, where
; each of them carries $TRAINGROUP_TRACKBUILDER in its script.ini:
;
;   russian_service_   agmu, dkgu5, edk300, muv69, tbm_kt1, uk25 and their wagons
;   russian_crane      russian_crane, _v2, _vagon
;
; ...and the model names themselves - agmu, dkgu, uk25, muv69, kzh, edk300,
; tbm_kt1, pk1 - because DLC and workshop track builders do not live under those
; folder prefixes. Those came out of the game's own string table.
;
; Matching is a case-insensitive substring test. If yours still is not caught,
; the log names every train model the first time it sees one, and the census at
; the bottom of the report lists them all with how each was classified. Setting
; `match` REPLACES the whole built-in list.
;
; THE FALLBACK NAME LIST. Only consulted when the game's own flag cannot be
; read - the log says so when that happens. Copy it and edit one entry:
;
;   russian_service_  russian_crane
;   agmu  dkgu  uk25  uk-25  muv69  muv-69  kzh  edk300  edk-300  tbm_kt1
;   pk1  pk-1
;   trackbuilder  track_builder  tracklayer  track_layer
;
; ANYTHING FIVE CHARACTERS OR SHORTER must sit on a token boundary - the start
; or end of the name, or next to a character that is not a letter or digit. So
; "pk1" catches russian_pk1 and pk1_vagon but not pk10; "kzh" catches kzh_461
; but not kzhde. Longer patterns are plain substrings. This matters because a
; wrong match does not just mis-label a train: that whole model stops braking
; for other trains and runs red signals.
;
; match = russian_service_, russian_crane, my_workshop_tracklayer

; AND AN ESCAPE HATCH. `exclude` wins over `match`, so one false positive costs
; one line here instead of retyping the whole list above to drop a pattern.
;
; exclude = passenger_kzh, some_loco_pk1

; ---------------------------------------------------------------------------
; ONE-WAY SEMAPHORES  (new in 0.9)
;
; The rule above answers "may I proceed?". It cannot help a track builder that
; has laid track out past one-way signals facing the wrong way, because that
; train is not waiting at a red light - it has no route home AT ALL. The rail
; pathfinder treats a one-way semaphore as a one-way edge and refuses to search
; through it, so nothing ever gets as far as asking whether it may proceed.
;
; This switch patches four bytes in the router so that every one-way semaphore
; is read as a TWO-WAY semaphore. Each edit is one byte - a conditional jump
; turned into the unconditional jump to the same target - and that target is the
; branch the game itself takes for a two-way signal. Trace direction 0 through
; the original code and it lands exactly where the patched code lands.
;
; So it is not "signals off". Red is still red, blocks are still blocks, and the
; movement code is untouched. It is only about which routes the pathfinder is
; willing to find.
;
; READ THIS BIT. It is NOT limited to track builders, and it cannot be: the
; router's search context is a stack local built by whichever caller wanted a
; route, with no vehicle in it to test. While this is on, EVERY train on the map
; may plan a route the wrong way down a one-way section, which on a busy network
; is how you get a head-on meeting. Turn it on, let the builder come home, turn
; it off. That is what the key is for.
;
; 1 here means "already on when the game starts", which is a stronger statement
; than it looks. Ctrl+Alt+D (rebindable below) is the usual way in.
ignore_signal_direction = 0

debug              = 0
heartbeat_seconds  = 15


; ===========================================================================
;  WALKING - how far a citizen will walk
;
;  By default a citizen only counts a shop, a job or a service as reachable on
;  foot if the path to it is at most 480 metres, and a citizen with a car only
;  up to 2500 metres. That is a hard cutoff, not a difficulty setting: past it
;  the game does not consider the building reachable at all. This part lets you
;  raise or lower both numbers.
;
;  There is no hotkey and no per-frame work. The limits are patched once, when
;  the game starts, and every site is checked against the exact instruction and
;  value it expects before it is written. Nothing here changes the save format,
;  so a save loads with or without it.
; ===========================================================================
[walking]
enabled       = 1   ; same as walking = 0 above

; The longest path, in metres, a citizen will accept on foot. Base game: 480.
;
; Everything about walking in this game goes through one list per building -
; "the buildings you can reach from here on foot" - and this is the only number
; that decides what goes in it. There is no second check anywhere: raise this
; and a shop 800 m away is simply within walking distance, with no other
; consequence than more citizens on the footpaths and more connections to
; search when a building is placed.
;
; It is a path length along roads and footpaths, not a straight line: a building
; 400 m away across a river may be 1200 m of walking.
;
; 0 removes the limit entirely - the engine reads a non-positive value as "no
; ceiling" and the search then runs until it has exhausted the road graph. It
; works, and on a large city it makes every placement take seconds. Anything
; above 20000 is clamped to 20000 for the same reason, and a negative number is
; read as the base game's 480.
distance      = 1000

; The same for a citizen who owns a car: the longest drive between home, work
; and a parking lot the game will connect. Base game: 2500, which is where this
; leaves it. Worth raising alongside `distance` if you want cars to stay the
; long-range option - at distance = 2500 the two are equivalent and a car buys
; nothing.
car_distance  = 2500

; Both distances come with a second, wider figure the game uses after a road
; changes, to decide which buildings have to have their connections rebuilt -
; 530 for feet and 2600 for cars. They are raised to match whenever a limit
; above them is set, so a building 900 m from a new road still notices it.
; There is no setting for them: a rebuild radius narrower than the distance it
; serves is never what you want.

; Rebuild every walking and parking connection in the world each time a save is
; loaded, so a city you already have picks up the new distance.
;
; Connections live in the save rather than being derived from the map, so
; without this only what you build after the change uses the new limit - the
; town you already have keeps the connections it was built with. This is the
; game's OWN regeneration pass, the one it runs for a save older than the last
; time its developers raised these numbers; all this does is make its two
; conditions true. It costs a few seconds on the loading screen of a large city,
; once per load. Set it to 0 for fast loads if you do not mind the change only
; reaching new construction.
;
; The same applies in reverse: lowering `distance` again restores the limit for
; everything built from then on, but a save made while it was raised still
; holds the long connections until something regenerates them - the next load
; with this on, otherwise whenever a road near the pair changes.
regen_on_load = 1

; Log the sites and the values found in them before anything is written. Only
; useful after a game update, to see what the addresses below really hold.
probe         = 0

; THE IN-GAME HINT STILL SAYS "approx. 300m". That text is a language-file
; string and is not changed here; the number the game USES is the one above.
; The building window's walking-distance button highlights the same distance as
; the simulation does - it is patched at both of its sites - but the overlay
; half is the part least seen in game. If the button looks wrong and citizens
; clearly reach farther buildings, trust the citizens.


; ===========================================================================
;  SHARED
; ===========================================================================
[debug]
; 0 errors only
; 1 lifecycle: load, site verification, hooks, toggles, heartbeats
; 2 + every decision that changed something, and the return-address histograms
; 3 + a line per suppressed call, rate limited. Noisy on purpose.
;
; ONE WARNING ABOUT trace = 3. All three parts now share one log and one lock,
; and two of them log from the SIMULATION thread (anarchy's collision test,
; trackcrew's proceed test) while the third logs from the render thread. At
; trace 3 with a rail job running and a drag tool open they serialise against
; each other on that lock. It is a diagnostic level, not a play level - turn it
; back down when you have your answer.
;
; One trace level for the whole kit. Each part's `debug` above is separate -
; that one only decides whether its counters are kept.
trace             = 0

; ---------------------------------------------------------------------------
; HOTKEYS. Virtual-key codes, hex or decimal. Set one to 0 to unbind it.
;
;   0x41..0x5A = A..Z      0xDB = [      0xDD = ]      0x70.. = F1..
;
; Modifiers are matched EXACTLY: Alt+F means Alt down with Ctrl and Shift UP, so
; nothing here can fire anything else here by accident.
;
; CHANGED IN THE MERGE, and worth knowing if you had the old plugins: skins and
; trackcrew used to match "at least" - Ctrl+Alt+Shift+C fired the skins copy key
; because Ctrl and Alt were both down and Shift was not looked at. Anarchy
; already matched exactly. Now all three do, which is the safer of the two and
; the reason the thirteen Ctrl+Alt bindings below cannot reach each other.
;   0 = none (bare key - careful, the game uses most letters)
;   1 = Ctrl    2 = Alt    3 = Shift
;   4 = Ctrl+Alt    5 = Ctrl+Shift    6 = Alt+Shift
[keys]
modifier         = 4      ; Ctrl+Alt - everything except the anarchy toggle
anarchy_modifier = 2      ; Alt      - just the anarchy toggle

; --- anarchy ---
anarchy          = 0x46   ; F  -> Alt+F, on and off
anarchy_layer1   = 0x54   ; T  -> layer 1 on and off. Turning it off turns
                          ;       anarchy off with it, so this is the panic key.

; --- trackcrew ---
trackcrew_toggle = 0x47   ; G  -> this part on and off
trackcrew_oneway = 0x44   ; D  -> one-way semaphores on and off FOR ROUTING.
                          ;       Separate key on purpose: the toggle above is
                          ;       scoped to track builders and undone the moment
                          ;       it is off; this one writes four bytes into the
                          ;       game's router and affects every train.
                          ;       Set to 0 to have no key for it at all.

; --- skins. You should not need any of these for normal use. ---
skin_copy        = 0x43   ; C  - copy the selected building's skin, and remember
                          ;      it for that type
skin_paste       = 0x56   ; V  - put the copied skin on the selected building
skin_apply_all   = 0x41   ; A  - put it on EVERY building of that type
skin_undo        = 0x5A   ; Z  - undo the last apply-all
skin_next        = 0xDD   ; ]  - step the selected building's skin forwards
skin_prev        = 0xDB   ; [  - step it backwards (the game's own button cannot)
skin_retain      = 0x50   ; P  - turn retain-on-pick on and off mid-game
skin_selftest    = 0x53   ; S  - read a skin, write a different one, read it
                          ;      back, put the original back
skin_dump        = 0x48   ; H  - hex dump of the selected building

; --- shared by all three parts ---
report           = 0x52   ; R  - the full report: every part, then the shared
                          ;      site verification and counters
reset            = 0x4B   ; K  - zero every counter and census


; ===========================================================================
;  [sites] - every address the three parts know, so a game update is an edit
;  here and not a rebuild. build_stamp is the gate: if the exe's PE TimeDateStamp
;  is not this, nothing hooks and nothing is patched.
;
;  Anarchy's 114 refusal bytes are NOT here - they are compiled in from
;  an_sites.h, because a list of that length does not belong in a text file
;  where a typo writes a byte into the middle of an instruction.
;
;  HEX IS FINE HERE AND ONLY HERE - these are read with a hex-aware parser.
; ===========================================================================
[sites]
build_stamp     = 0x6A3EB6AD

; --- anarchy ---
collide         = 0x129F30   ; the building-collision predicate
overlap         = 0x56C820   ; the construction-overlap predicate
dist_ret_1      = 0x50CF34   ; the instruction after each of the four calls to
dist_ret_2      = 0x50D026   ; C3DCalcDistanceSq that make up the signal test
dist_ret_3      = 0x50E447
dist_ret_4      = 0x50E522
line_lo         = 0x4FCAF0   ; the shared drag-a-line tool: rail, road bridges,
line_hi         = 0x518A14   ; pipes, water, sewage, heating, conveyors, fences,
                             ; cableways, airroads and power lines, all one
                             ; function with a different kind code
building_lo     = 0x2BADE0   ; the tool that places buildings
building_hi     = 0x2D8355
wire_lo         = 0x51D160   ; wire and pole validity - and FENCES, which are
wire_hi         = 0x51F9B1   ; poles and spans like a power line. Called from
                             ; one place only: the line tool above.
pipe_lo         = 0x5223C0   ; pipe segment validity: slope, depth, length.
pipe_hi         = 0x522F93   ; also called from the line tool only.
; All four pairs are checked: a range has to lie inside the executable and be
; no wider than 2 MB, or the built-in one is used and the log says so. They
; decide who layer 1 is willing to lie to, and "0 to 0xFFFFFFFF" would mean
; every caller in the game.

; --- skins ---
world           = 0x9D4F10   ; the world object itself (NOT a pointer slot)
bldmgr_slot     = 0x9941F0   ; a POINTER SLOT; manager = *(*(slot) + bldmgr_inner)
bldmgr_inner    = 0xFF8
w_building_vec  = 0x11B08    ; vector<C3D_BUILDING*> inside the world
w_day           = 0x590
w_year          = 0x594
w_build_sel     = 0xD428     ; the build menu's selected type descriptor
w_info_window   = 0xCAC0     ; -> struct whose [0] is the info WINDOW, not the
                             ; building. See info_building at the bottom.
b_typedesc      = 0x318
b_instance      = 0x5F4      ; int, index into the type's render instance array
b_built         = 0x604      ; documented for reference; nothing reads it
td_objname      = 0x000
td_rendertype   = 0x410      ; int, the argument to C3D_BUILDING::GetType
ty_materials    = 0x0A8      ; C3D_MATERIAL*[], one per skin
ty_skincount    = 0x2A8      ; int
ty_instances    = 0x2C0      ; -> instance array
inst_stride     = 0x118      ; 280 bytes per instance
inst_skin       = 0x04E      ; THE SKIN BYTE
pick_ret_a      = 0x3CB1DD   ; the instruction after the picker's first
pick_ret_b      = 0x3CB2EB   ; and second call to CollisionRay
; info_building = 0x240      ; leave unset and it is discovered and logged

; --- trackcrew ---
can_proceed     = 0x6AC6E0   ; the train's "may I proceed?" predicate
v_ignore_red    = 0x5E0      ; the per-vehicle "ignore red signal" flag
name_mode       = 3          ; 3 = the name is a char array at type + name_offset
name_offset     = 0x30       ; +0 is the mod folder path; +0x30 is the name
name_scan       = 0x800

; The four one-way-semaphore sites. Each address is the START of a short window
; the plugin compares against recorded bytes; the byte it changes is inside it.
; The first two are in the rail A* edge cost, the second two in the path builder
; that turns a found route into a drivable one. All four must verify or the
; switch stays off entirely - a router that ignores direction in two places out
; of four plans routes the path builder then refuses to walk.
one_way_1       = 0x57A44F   ; cmp [rcx+0x14],1 / jne  ->  jmp
one_way_2       = 0x57A465   ; cmp [rcx+0x14],2 / jne  ->  jmp
one_way_3       = 0x58450C   ; cmp edx,0xa      / je   ->  jmp
one_way_4       = 0x5847E8   ; cmp r8d,0xa      / je   ->  jmp
type_offset     = 0x1708     ; the vehicle's type object

; --- walking ---
;
; NEW GAME BUILD? Walking carries a built-in table for each build it knows
; (v1.1.1.9 and v1.2.0.8 - see src/wk_sites.h). On any other build it logs the
; exe's stamp, says it has no table, and writes nothing. To add one without
; rebuilding the DLL, give ALL sixteen keys below - it is all or none, and
; walk_build_stamp must equal the exe's PE TimeDateStamp or the table is
; ignored. `tools/walking_scan.py SOVIET64.exe` prints them for you, with the
; exe's stamp, every site it could verify against the game's own bytes, and
; every one it could only predict. The list below is the v1.1.1.9 table, as
; the example of what the values look like.
;
; walk_build_stamp  = 0x6A3EB6AD
; walk_limit_op     = 0x12E2CD   ; mov dword [rsp+7Ch],480.0f  (the batch builder; an immediate)
