$ITEM_NAME "sovietkit - Anarchy, Skins and Better Trackbuilders"
 
$ITEM_DESC "Three quality-of-life mods for Workers & Resources: Soviet Republic, in one TesmioLoader plugin.\n\nANARCHY - Alt+F\n\nEvery 'you can't build that there' goes quiet: slope, angle, terrain, water, collisions, crossings, connection rules, the lot. Press the key again and all 367 bytes go back where they were. While it is on, the word ANARCHY sits on screen so you never wonder which mode you are in.\n\nIt is not a launch option and it is not a save flag. It is 370 one-byte edits to the game's own instructions, applied when you press the key and reverted when you press it again. Every site is compared against the whole recorded instruction before anything is written, so if the game updates, this refuses rather than corrupts. One byte also means no instruction boundary can move and no thread can read a half-written value.\n\nOne refusal is left on: 'Outside map borders!'. That one is not the game being fussy, it is the last check between the build tools and memory the game does not own. There is a setting for it, labelled for what it is.\n\nSKINS\n\nRecolour a building with the game's own spray-can and the plugin takes that as a decision about the TYPE: every building of that type you place from then on is built already wearing that skin. The ones already standing are left exactly as you built them. No hotkey needed. There are keys for copy, paste, step forwards and backwards through a type's skins, apply-to-all, and an undo for when you did not mean it.\n\nBETTER TRACKBUILDERS\n\nRail construction trains stop waiting. For track-building trains only, the game's own 'may I proceed?' answer is always yes: they run red signals and they do not brake for each other. That is not invented behaviour, it is exactly what happens when you click 'Ignore red signal' on a train, reached through the same function at the same moment.\n\nIt asks the GAME which trains those are - the $TRAINGROUP_TRACKBUILDER flag out of each train's script.ini, the same thing the game reads - so it is equally right about the base game's eleven, the DLC's, a disassembled one, and a workshop train written by somebody who has never heard of this plugin. Nothing has to be configured for a modded track builder.\n\nAnd on a separate key, Ctrl+Alt+D, the rail router can be made to read every one-way signal as a two-way one - which is how you get a track builder home past signals facing the wrong way. Read the warning in the ini before using it: while it is on, it is not limited to track builders.\n\nANY PART CAN BE SWITCHED OFF at the top of sovietkit.ini, without touching the other two. Every key is rebindable.\n\nREQUIRES TesmioLoader, by Tesmio. This is a plugin and does not run without it. Launch through tesmiolauncher.exe, not Steam's Play button.\n\nINSTALLING. Steam cannot put a loader plugin where it has to go. Copy the tesmioloader folder from this item into your SovietRepublic folder, say yes to merging, and add sovietkit=1 to tesmioloader.ini. Full instructions are in README.txt.\n\nBuilt against SOVIET64.exe v1.1.1.9. On any other build it says so in the log, hooks nothing and patches nothing - that is the message, not a crash.\n\nSource, the reverse-engineering notes and the full table of what it patches: https://github.com/daniepe/WRSR-1.1.19-WRSR-Anarchy-and-QOL"
 
$END
